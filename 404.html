<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 — 봉수학</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0c0f">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png">
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0c0f;--fg:#f3f1ea;--dim:#9a9a94;--line:rgba(243,241,234,.12);--gold:#d6b46a}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
a{color:inherit;text-decoration:none}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.glow{position:fixed;inset:-20%;pointer-events:none;filter:blur(80px);opacity:.5}
.glow i{position:absolute;border-radius:50%}
.glow i:nth-child(1){width:46vw;height:46vw;left:48%;top:8%;background:radial-gradient(circle,#2b4f8f 0,transparent 65%)}
.glow i:nth-child(2){width:34vw;height:34vw;left:62%;top:42%;background:radial-gradient(circle,#8a6a2c 0,transparent 65%)}
.page{position:relative;min-height:100vh;display:flex;flex-direction:column;padding:0 clamp(20px,4vw,56px)}
header{display:flex;align-items:center;height:84px}
.wm{display:flex;align-items:baseline;gap:10px}.wm b{font-size:21px;font-weight:800;letter-spacing:-.03em}.wm .serif{font-size:19px;color:var(--dim)}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:4vh 0 8vh}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:10px;margin-bottom:24px}
.mono:before{content:"";width:28px;height:1px;background:var(--gold)}
h1{margin:0;font-weight:800;letter-spacing:-.05em;line-height:1.05;font-size:clamp(44px,7vw,96px)}
h1 em{font-style:normal;color:var(--gold)}
p{margin:22px 0 34px;font-size:16px;line-height:1.75;color:var(--dim)}
.btns{display:flex;gap:12px;flex-wrap:wrap}
.go{display:inline-flex;align-items:center;gap:12px;padding:14px 22px;border-radius:999px;background:var(--fg);color:#0b0c0f;font-weight:700;font-size:15px}
.ghost{display:inline-flex;align-items:center;padding:14px 22px;border-radius:999px;border:1px solid var(--line);color:var(--fg);font-size:15px}
.biz{margin:0 calc(-1*clamp(20px,4vw,56px));padding:14px clamp(20px,4vw,56px) 18px;border-top:1px solid var(--line);font-size:12px;line-height:1.7;color:var(--dim)}
</style>
</head>
<body>
<div class="glow"><i></i><i></i></div>
<div class="page">
  <header><a class="wm" href="/"><b>봉수학</b><span class="serif">Bongsuhak</span></a></header>
  <main>
    <div class="mono">404 · Page not found</div>
    <h1>페이지를 찾을 수 <em>없습니다.</em></h1>
    <p>주소가 바뀌었거나 없는 페이지예요.</p>
    <div class="btns"><a class="go" href="/">첫 화면으로 →</a><a class="ghost" href="/company.html">회사 소개</a></div>
  </main>
  <footer class="biz">상호 봉수학 · 대표 김봉현 · 사업자등록번호 560-51-01158 · bong@bongsuhak.com · © 2026 봉수학</footer>
</div>
</body>
</html>
